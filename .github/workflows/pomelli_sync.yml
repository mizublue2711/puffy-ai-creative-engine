name: Pomelli Asset Ingestion & Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dashboard_url:
        description: 'Override Google Pomelli / Stitch dashboard URL'
        required: false
        default: ''
      branch_mode:
        description: 'Commit mode: main (unattended) or pr (feature branch)'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - pr
  repository_dispatch:
    types:
      - pomelli-sync
      - n8n-webhook

permissions:
  contents: write

concurrency:
  group: pomelli-asset-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest-pomelli-assets:
    name: Scrape & Sync Pomelli Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Pomelli headless scraper
        env:
          POMELLI_AUTH_SESSION: ${{ secrets.POMELLI_AUTH_SESSION }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          POMELLI_DASHBOARD_URL: ${{ inputs.dashboard_url || github.event.client_payload.dashboard_url || vars.POMELLI_DASHBOARD_URL || 'https://labs.google/pomelli' }}
          HEADLESS: 'true'
        run: npm run scrape:pomelli

      - name: Validate integrity and sync assets to GitHub
        env:
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH_MODE: ${{ inputs.branch_mode || github.event.client_payload.branch_mode || 'main' }}
        run: npx tsx scripts/sync_github.ts --push

      - name: Run deployment config & JSON audit
        run: npm run audit
