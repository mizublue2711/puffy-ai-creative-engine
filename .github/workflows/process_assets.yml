name: Process Raw Mattress Assets

on:
  push:
    branches:
      - main
    paths:
      - 'assets/raw_mattress/**/*.png'
      - 'assets/raw_mattress/**/*.webp'
      - 'scripts/shadow_engine.py'
      - 'scripts/grid_normalizer.py'
      - 'scripts/run_pipeline.py'
  workflow_dispatch:
    inputs:
      canvas_size:
        description: 'Target canvas size (N or WxH)'
        required: false
        default: '1024'

permissions:
  contents: write

concurrency:
  group: process-raw-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process-assets:
    name: Run Zero-Drift Contour Shadow & Grid Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (Pillow & NumPy)
        run: python -m pip install --upgrade pip && pip install pillow numpy

      - name: Run Puffy 3-in-1 Asset Pipeline
        run: |
          python scripts/run_pipeline.py \
            --input assets/raw_mattress \
            --output assets/catalog/processed \
            --canvas-size "${{ inputs.canvas_size || '1024' }}" \
            --manifest assets/manifest.json

      - name: Commit processed catalog & manifest
        run: |
          git config user.name "puffy-creative-bot"
          git config user.email "bot@puffy.com"
          git add assets/catalog/processed assets/manifest.json
          if git diff --cached --quiet; then
            echo "No new processed assets to commit."
          else
            git commit -m "chore(assets): process raw cutouts via contour shadow & 75% grid pipeline"
            git push
          fi
