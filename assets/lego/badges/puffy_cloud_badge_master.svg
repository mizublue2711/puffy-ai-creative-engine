      <path fill="url(#satinThreadRibs)"
        d="M47.44.79c-2.12 0-3.63.44-4.57 1.32-.97.93-1.46 2.33-1.46 4.2v21.27h5.27v-15.6h.77a2.5 2.5 0 0 0 1.78-.74c.5-.5.77-1.13.77-1.9V8.16h-3.33v-1.4c0-.62.13-1.03.39-1.24.3-.21.82-.31 1.54-.31H50V.79h-2.56Z" />

      <!-- Second Letter f -->
      <path fill="#090B10" stroke="#090B10" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"
        d="M57.6.79c-2.12 0-3.64.44-4.57 1.32-.98.93-1.47 2.33-1.47 4.2v21.27h5.27v-15.6h.78a2.5 2.5 0 0 0 1.77-.74c.51-.5.78-1.13.78-1.9V8.16h-3.34v-1.4c0-.62.13-1.03.4-1.24.3-.21.82-.31 1.54-.31h1.4V.79H57.6Z" />
      <path id="puffy-letter-f2" fill="url(#satinThreadRelief)"
        d="M57.6.79c-2.12 0-3.64.44-4.57 1.32-.98.93-1.47 2.33-1.47 4.2v21.27h5.27v-15.6h.78a2.5 2.5 0 0 0 1.77-.74c.51-.5.78-1.13.78-1.9V8.16h-3.34v-1.4c0-.62.13-1.03.4-1.24.3-.21.82-.31 1.54-.31h1.4V.79H57.6Z" />
      <path fill="url(#satinThreadRibs)"
        d="M57.6.79c-2.12 0-3.64.44-4.57 1.32-.98.93-1.47 2.33-1.47 4.2v21.27h5.27v-15.6h.78a2.5 2.5 0 0 0 1.77-.74c.51-.5.78-1.13.78-1.9V8.16h-3.34v-1.4c0-.62.13-1.03.4-1.24.3-.21.82-.31 1.54-.31h1.4V.79H57.6Z" />

      <!-- Letter y -->
      <path fill="#090B10" stroke="#090B10" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"
        d="M61.84 34.53l2.97-4.26h1.49a3.7 3.7 0 0 0 2.46-.74c.6-.5.72-1.27.36-2.36L61.84 7.88h6.02l4.23 13.33 3.68-11.47c.31-1.24 1.15-1.86 2.5-1.86h3.76l-7.98 22.23c-.63 1.7-1.41 2.91-2.36 3.63-.94.62-2.48.94-4.61.94h-5.36l.12-.15Z" />
      <path id="puffy-letter-y" fill="url(#satinThreadRelief)"
